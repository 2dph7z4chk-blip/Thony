<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thonys Spiele</title>
    <style>
        :root {
            --bg-color: #0f1020;
            --card-bg: #1a1c38;
            --accent: #00ffcc;
            --accent-purple: #9d4edd;
            --text: #ffffff;
            --text-dim: #a0a0c0;
            --danger: #ff4757;
            --success: #2ed573;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }

        header {
            width: 100%; max-width: 500px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 15px;
        }
        .logo { font-size: 20px; font-weight: bold; background: linear-gradient(45deg, var(--accent), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-stats { display: flex; gap: 12px; align-items: center; background: var(--card-bg); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .stat-item { display: flex; align-items: center; gap: 4px; font-weight: bold; font-size: 13px; }

        .container { width: 100%; max-width: 500px; padding: 0 15px 30px 15px; display: flex; flex-direction: column; gap: 15px; }
        
        .section-title { font-size: 18px; margin-bottom: 8px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        
        .games-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .game-card {
            background: var(--card-bg); border-radius: 14px; padding: 16px; border: 1px solid rgba(255,255,255,0.08);
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            transition: transform 0.1s;
        }
        .game-card:active { transform: scale(0.98); }
        .game-card h3 { font-size: 18px; margin-bottom: 4px; }
        .game-card p { color: var(--text-dim); font-size: 12px; }
        .play-btn { background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; height: fit-content; }

        .hub-extras { display: flex; gap: 10px; }
        .extra-btn { flex: 1; padding: 12px 10px; background: var(--card-bg); border: 1px solid var(--accent-purple); border-radius: 12px; color: white; font-weight: bold; cursor: pointer; text-align: center; font-size: 13px; }

        .view { display: none; width: 100%; flex-direction: column; align-items: center; gap: 12px; }
        .view.active { display: flex; }
        .back-bar { width: 100%; display: flex; justify-content: flex-start; }
        .back-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }

        canvas { background: #111; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); max-width: 100%; touch-action: none; display: block; margin: 0 auto; }
